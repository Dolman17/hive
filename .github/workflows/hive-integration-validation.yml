name: HIVE integration validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/hive-integration-platform]

jobs:
  integration-validation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hive_test
          POSTGRES_PASSWORD: hive_test
          POSTGRES_DB: hive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hive_test -d hive_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://hive_test:hive_test@127.0.0.1:5432/hive_test
      SECRET_KEY: ci-secret-key
      UPLOAD_FOLDER: /tmp/hive-uploads
      HIVE_RESOLVHR_SSO_SECRET: ci-resolvhr-secret
      HIVE_PATHLY_SSO_SECRET: ci-pathly-secret
      HIVE_PATHLYHIRE_SSO_SECRET: ci-pathlyhire-secret
      HIVE_ELLIPSECRM_SSO_SECRET: ci-ellipsecrm-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Verify Flask app imports
        run: python -c "from app import app; print(app.name); print(len(list(app.url_map.iter_rules())))"

      - name: Verify migration graph
        run: flask --app app db heads

      - name: Upgrade clean PostgreSQL database
        run: flask --app app db upgrade

      - name: Verify database revision
        run: flask --app app db current

      - name: Verify integration routes and unauthorized API behavior
        run: |
          python - <<'PY'
          from app import app

          rules = {rule.rule for rule in app.url_map.iter_rules()}
          required = {
              '/integrations/action-centre',
              '/integrations/apps/<app_slug>/launch',
              '/api/integrations/v1/actions',
              '/api/integrations/v1/events',
              '/admin/integrations',
          }
          missing = required - rules
          assert not missing, f'Missing integration routes: {sorted(missing)}'

          client = app.test_client()
          response = client.post('/api/integrations/v1/events', json={})
          assert response.status_code == 401, response.get_data(as_text=True)
          print('HIVE integration route smoke test passed')
          PY
