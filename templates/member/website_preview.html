{% extends "base.html" %}

{% block content %}

<div class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
    <div>
        <p class="text-sm font-semibold text-amber-600 uppercase tracking-wide">
            Website Preview
        </p>

        <h1 class="text-3xl font-bold text-slate-950 mt-2">
            {{ settings.business_name }}
        </h1>

        <p class="text-slate-600 mt-2">
            Preview your public consultant website.
        </p>
    </div>

    <div class="flex flex-wrap gap-3">
        <a href="{{ url_for('website_settings') }}"
           class="rounded-xl bg-white border border-slate-300 text-slate-800 px-5 py-3 text-sm font-semibold hover:bg-slate-50">
            Edit Settings
        </a>

        <a href="{{ url_for('consultant_site', tenant_slug=settings.tenant_slug) }}"
           class="rounded-xl bg-amber-400 text-slate-950 px-5 py-3 text-sm font-semibold hover:bg-amber-300">
            Open Public URL
        </a>
    </div>
</div>

<div class="rounded-3xl border border-slate-300 bg-white shadow-sm overflow-hidden">
    {% include "public/consultant_site.html" %}
</div>

{% endblock %}
